name: CI - Build & Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-ci:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ExpenseTracker.sln

      - name: Build solution
        run: dotnet build ExpenseTracker.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test ExpenseTracker.sln -c Release --no-build --verbosity normal

  frontend-ci:
    name: Frontend (React / Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: expense-tracker-web/package-lock.json

      - name: Install dependencies
        working-directory: ./expense-tracker-web
        run: npm ci

      - name: Build frontend
        working-directory: ./expense-tracker-web
        run: npm run build
