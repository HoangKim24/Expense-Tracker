name: Deploy Expense Tracker API to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          
      - name: Restore dependencies
        run: dotnet restore src/ExpenseTracker.Api/ExpenseTracker.Api.csproj

      - name: Build
        run: dotnet build src/ExpenseTracker.Api/ExpenseTracker.Api.csproj --no-restore -c Release

      # Giả sử có project Test, tạm thời comment lại nếu chưa tạo
      # - name: Run Tests
      #   run: dotnet test --no-build --verbosity normal

  docker-build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/expense-tracker-api:latest

  deploy-to-vps:
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/expense-tracker
            docker-compose pull expense-tracker-api
            docker-compose up -d --no-deps expense-tracker-api
            docker image prune -f
